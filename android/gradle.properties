# org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# android.useAndroidX=true
# android.enableJetifier=true

# ---- Gradle stability for CI ----
org.gradle.daemon=false
org.gradle.vfs.watch=false
org.gradle.parallel=false

# ---- JVM memory (SAFE for GitHub runners) ----
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# ---- AndroidX ----
android.useAndroidX=true
android.enableJetifier=true


# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# ---- Resource shrinking: precise mode ----
# app/build.gradle.kts already sets isMinifyEnabled + isShrinkResources for
# release, but Play Console's "optimised resource shrinking" check wants the
# newer, more precise resource shrinker (traces actual R.field usage instead
# of just Manifest/layout references) — smaller release APK/AAB, no code
# behavior change.
android.experimental.enableNewResourceShrinker=true
android.experimental.enableNewResourceShrinker.preciseShrinking=true
