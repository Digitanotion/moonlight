<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the live stream on Moonlight</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #150C24; color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { max-width: 380px; width: 100%; text-align: center; }
  .logo { width: 96px; height: 96px; border-radius: 24px; margin: 0 auto 20px; display:block; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  p  { font-size: 14px; color: #B9AED0; margin-bottom: 24px; line-height: 1.5; }
  .btn {
    display: block; width: 100%; padding: 14px 20px; border-radius: 14px;
    background: #FF7A00; color: #fff; font-weight: 600; font-size: 15px;
    text-decoration: none; border: 0; cursor: pointer; margin-bottom: 12px;
  }
  .btn.secondary { background: rgba(255,255,255,.08); color: #fff; }
  .muted { font-size: 12px; color: #7A6E90; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="Moonlight" onerror="this.style.display='none'">
    <h1 id="headline">Someone is live on Moonlight</h1>
    <p id="sub">Opening the stream in the app…</p>

    <a class="btn" id="openApp" href="#">Open in the Moonlight app</a>
    <a class="btn secondary" id="store" href="#">Get Moonlight</a>

    <p class="muted">If the app didn’t open automatically, tap “Open in the Moonlight app”.</p>
  </div>

<script>
(function () {
  var PLAY_URL = "https://play.google.com/store/apps/details?id=com.app.moonlightstream";
  var APP_STORE_URL = "https://apps.apple.com/app/moonlight"; // update with real App Store id when live

  // URL shape: https://moonlightstream.app/live/<uuid>
  var parts = location.pathname.split("/").filter(Boolean);
  var kind = parts[0] || "live";           // "live" | "post"
  var id = parts[1] || "";

  var ua = navigator.userAgent || "";
  var isAndroid = /android/i.test(ua);
  var isIOS = /iphone|ipad|ipod/i.test(ua);
  var store = isIOS ? APP_STORE_URL : PLAY_URL;

  document.getElementById("store").href = store;

  var deepLink = "moonlight://" + kind + "/" + id;
  document.getElementById("openApp").href = deepLink;

  if (kind === "post") {
    document.getElementById("headline").textContent = "View this post on Moonlight";
  }

  // Try to open the app immediately. On Android the verified App Link
  // usually means we never even land here; this covers the fallback path.
  if (id) {
    var now = Date.now();
    var timer = setTimeout(function () {
      // Still here ~1.2s later → app not installed (or didn't open). Send to store.
      if (Date.now() - now < 2000) window.location = store;
    }, 1200);

    window.addEventListener("pagehide", function () { clearTimeout(timer); });
    window.addEventListener("blur", function () { clearTimeout(timer); });

    window.location = deepLink;
  }
})();
</script>
</body>
</html>
